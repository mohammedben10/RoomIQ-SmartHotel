{% extends 'base.html' %}

{% block content %}
<div class="grid-container">
  
  <div class="panel">
    <div class="panel-header">
      <h3>AI Agent Parameters</h3>
    </div>
    <div class="panel-body-a">
      
      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size: 13px; color: var(--text-muted-2); margin-bottom: 5px;">Isolation Forest Contamination Prior</label>
        <input type="range" min="1" max="10" value="3" style="width: 100%; accent-color: var(--accent-cyan-2);">
        <div style="text-align: right; font-size: 12px; color: var(--text-main); margin-top: 4px;">3.25% (Recommended)</div>
      </div>

      <div style="margin-bottom: 20px;">
        <label style="display:block; font-size: 13px; color: var(--text-muted-2); margin-bottom: 5px;">Fire Hazard Threshold Multiplier</label>
        <input type="range" min="1" max="5" value="2" style="width: 100%; accent-color: var(--danger-1);">
      </div>

      <div class="ac-row" style="margin-top: 10px;">
        <div class="ac-info">
          <div>
            <div class="ac-label title-font">Retrain Nightly</div>
            <div class="ac-sub mono">Auto-adjust to environmental baseline</div>
          </div>
        </div>
        <label class="switch">
          <input type="checkbox" checked>
          <span class="slider"></span>
        </label>
      </div>

    </div>
  </div>

  <div class="panel">
    <div class="panel-header">
      <h3>Notification Profiles</h3>
    </div>
    <div class="panel-body-a">
      <div class="sensor-tile" style="margin-bottom: 16px;">
        <div class="tile-title mono" style="color: var(--text-main);">Danger Level Alerts (Fire)</div>
        <div class="mono" style="font-size: 12px; color: var(--text-muted-2); margin-top: 5px;">SMS + Email + Desk Alarm</div>
      </div>
      
      <div class="sensor-tile">
        <div class="tile-title mono" style="color: var(--text-main);">Warning Alerts (Smoking)</div>
        <div class="mono" style="font-size: 12px; color: var(--text-muted-2); margin-top: 5px;">Email to Housekeeping</div>
      </div>
      
      <button style="margin-top: 20px; width: 100%; padding: 12px; background-color: var(--brand-blue-1); border: none; color: white; border-radius: 6px; cursor: pointer; font-weight: 600;">Save Configuration</button>
    </div>
  </div>

</div>
<script>
  document.querySelector('.breadcrumb-subtitle').innerText = "Home / Administration / Settings";
  document.querySelector('.topbar h2').innerText = "System Preferences";
</script>
{% endblock %}
